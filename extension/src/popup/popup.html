<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Remember</title>
  <style>
    :root { color-scheme: light dark; --fg: #1a1725; --muted: #6f6a80; --bg: #fff;
            --line: rgba(24,16,64,.12); --accent: #6d4aff; --soft: #f6f5fb; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #ece9f5; --muted: #9d97ad; --bg: #1d1b26;
              --line: rgba(255,255,255,.12); --soft: #262330; }
    }
    * { box-sizing: border-box; }
    body { width: 340px; margin: 0; padding: 12px 14px 14px; background: var(--bg); color: var(--fg);
           font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
    h1 { font-size: 14px; margin: 0; }
    .ver { font-size: 10px; font-weight: 400; color: var(--muted); }
    .hint { font-size: 11px; color: var(--muted); margin: 0 0 10px; }
    .export { font: inherit; font-size: 12px; width: 100%; cursor: pointer;
              min-height: 34px; border-radius: 8px; border: 1px solid var(--line);
              background: var(--soft); color: var(--accent); font-weight: 600; }
    .export:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); color: #fff; }
    .export:disabled { opacity: .7; cursor: default; }

    /* --- công tắc highlight --- */
    .toggle { display: flex; align-items: flex-start; gap: 8px; cursor: pointer;
              border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px;
              margin-bottom: 10px; background: var(--soft); }
    .toggle input { margin: 2px 0 0; accent-color: var(--accent); flex: none; }
    .toggle b { font-size: 12px; font-weight: 600; display: block; }
    .toggle small { font-size: 11px; color: var(--muted); }
    /* Tên miền là dữ liệu, không phải nhãn: cho nó mã chữ đơn cách để đọc chính xác
       từng ký tự, và ngắt được giữa dòng với domain dài. */
    .toggle b [data-role="hl-host"] { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                                      font-size: 11.5px; word-break: break-all; }
    .toggle:has(input:disabled) { opacity: .6; }


    /* --- tài khoản --- */
    .account { border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px;
               margin-bottom: 10px; background: var(--soft); }
    .acc-row { display: flex; align-items: center; gap: 7px; }
    .acc-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted); }
    .acc-dot.connected { background: #17916f; }
    .acc-dot.logged_out { background: #c07a1e; }
    .acc-dot.no_permission { background: var(--muted); }
    .acc-dot.error { background: #c0344b; }
    .acc-label { font-size: 12px; font-weight: 600; overflow: hidden;
                 text-overflow: ellipsis; white-space: nowrap; }
    .acc-note { font-size: 11px; color: var(--muted); margin: 6px 0 8px; line-height: 1.45; }
    .acc-btn { font: inherit; font-size: 11.5px; width: 100%; cursor: pointer; min-height: 30px;
               margin-top: 6px; border-radius: 7px; border: 1px solid var(--line);
               background: var(--bg); color: var(--fg); }
    .acc-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .acc-btn:disabled { opacity: .55; cursor: default; }
    .acc-cfg { margin-top: 8px; }
    .acc-cfg summary { font-size: 11px; color: var(--muted); cursor: pointer; }
    .acc-input { font: inherit; font-size: 11.5px; width: 100%; margin-top: 6px; min-height: 28px;
                 padding: 0 7px; border-radius: 7px; border: 1px solid var(--line);
                 background: var(--bg); color: var(--fg); }
  </style>
</head>
<body>
  <header>
    <h1>Remember</h1>
  </header>
  <p class="hint">Bôi đen text trên trang → icon tím hiện ra → click để lưu thẻ.</p>
  <div class="account" data-role="account"></div>
  <label class="toggle">
    <input type="checkbox" data-role="hl" checked />
    <span>
      <b>Highlight trên <span data-role="hl-host">trang này</span></b>
      <small data-role="hl-note">Tô các từ đã có thẻ ngay trên trang đang đọc.</small>
    </span>
  </label>
  <button class="export" data-role="export">⇄ Xuất dữ liệu ra file</button>
  <!--
    `type="module"` là BẮT BUỘC, không phải cho hiện đại.

    Hai file này từng là classic script, tức là dùng CHUNG global scope. Cả hai đều
    khai báo `el` và `render` ở cấp cao nhất: `account.js` (chạy trước) có
    `const el`, `popup.js` có `function el`. Khi trình duyệt nạp `popup.js`, nó ném
    `SyntaxError: Identifier 'el' has already been declared` NGAY LÚC KHỞI TẠO —
    nghĩa là popup.js không chạy một dòng nào: không gắn listener cho ô tick
    highlight, không nạp danh sách thẻ, không có log nào. Nhìn từ ngoài y như
    "công tắc không hoạt động".

    Module có scope riêng cho từng file, nên lớp lỗi này không thể xảy ra lại. Thứ
    cần chia sẻ thì chia sẻ TƯỜNG MINH qua `window.*` (`window.reloadCards`).
  -->
  <script type="module" src="account.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
